packages:
  - 'packages/*'
  - 'apps/*'
  - 'games/*'

# electron-builder doesn't traverse pnpm's symlinked store properly when
# packaging, many transitive deps (e.g. `ms`, `fast-deep-equal`) end up
# missing from app.asar. `hoisted` makes pnpm produce a flat node_modules
# layout (like npm/yarn) so electron-builder can resolve everything.
# NB: pnpm 11 no longer reads these from `.npmrc` - they live here now.
nodeLinker: hoisted
shamefullyHoist: true

# pnpm 11 defaults this to `install`, which is actively harmful here : the
# `_deploy:prod` build step leaves the root node_modules in a prod-only state,
# so the next `pnpm exec` (git hooks, CI) would try to re-install --production
# and abort for lack of a TTY. CI installs explicitly with --frozen-lockfile.
verifyDepsBeforeRun: false

allowBuilds:
  # Only validates the native bindings and, if they are missing, shells out to
  # `npm install @swc/wasm`. pnpm installs the platform-specific optional deps
  # correctly, so the script is dead weight (and a network call at install time).
  '@swc/core': false
  electron: true
  electron-winstaller: true
  esbuild: true
  lefthook: true
  msw: true

catalog:
  '@vitest/coverage-v8': ^4.1.5
  esbuild: ^0.27.7
  i18next: ^26.0.8
  react: ^19.2.5
  react-dom: ^19.2.5
  rimraf: ^6.1.3
  typescript: ^7.0.2
  vitest: ^4.1.5
  zod: ^4.3.6

blockExoticSubdeps: true
minimumReleaseAge: 1440
