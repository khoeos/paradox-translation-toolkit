packages:
  - 'packages/*'
  - 'apps/*'

nodeLinker: hoisted
shamefullyHoist: true

verifyDepsBeforeRun: false

allowBuilds:
  '@swc/core': false
  electron: true
  electron-winstaller: true
  esbuild: true
  lefthook: true
  msw: true

catalog:
  '@vitest/coverage-v8': ^5.1.1
  esbuild: ^0.28.2
  i18next: ^27.1.5
  react: ^19.3.1
  react-dom: ^19.3.1
  rimraf: ^6.1.4
  typescript: ^7.0.2
  vitest: ^5.1.1
  zod: ^4.6.7

blockExoticSubdeps: true
minimumReleaseAge: 1440
