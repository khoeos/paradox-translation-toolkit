packages:
  - 'packages/*'
  - 'apps/*'

nodeLinker: hoisted
shamefullyHoist: true

verifyDepsBeforeRun: false

allowBuilds:
  '@swc/core': false
  electron: true
  electron-winstaller: true
  esbuild: true
  lefthook: true
  msw: true

catalog:
  '@vitest/coverage-v8': ^4.1.11
  esbuild: ^0.28.2
  i18next: ^26.4.1
  react: ^19.2.8
  react-dom: ^19.2.8
  rimraf: ^6.1.3
  typescript: ^7.0.2
  vitest: ^4.1.11
  zod: ^4.5.4

blockExoticSubdeps: true
minimumReleaseAge: 1440
